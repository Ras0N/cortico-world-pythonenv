name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bubblewrap + Python venv
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3 python3-venv python3-pip
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm smoke:bwrap
      - run: pnpm smoke:bwrap:accept
